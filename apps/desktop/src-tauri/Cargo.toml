[package]
name = "dawnsight-app"
version = "0.4.2"
description = "AI Video Reader desktop app with native libmpv playback"
authors = ["you"]
edition = "2021"

[lib]
name = "dawnsight_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
pkg-config = "0.3"

[dependencies]
dawnsight-core.workspace = true
dawnsight-ai.workspace = true
# agentpools via crates.io (published 0.1.10).
agentpools = "0.1.10"
agentpools-acp = "0.1.10"
dawnsight-library.workspace = true
dawnsight-notes.workspace = true
dawnsight-player.workspace = true
dawnsight-ytdl.workspace = true
dawnsight-mcp.workspace = true
dawnsight-media.workspace = true
dawnsight-subtitle.workspace = true
dawnsight-asr.workspace = true
tauri = { version = "2", default-features = false, features = ["wry", "compression", "dynamic-acl", "x11", "dbus"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
ureq = { version = "3.1", features = ["json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
url = "2"
libmpv2 = "6"
libmpv2-sys = "4"
libloading = "0.8"
which = "7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
raw-window-handle = "0.6"
tracing-appender = "0.2.5"
tauri-plugin-updater = "2.11.0"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
x11 = { version = "2.21", features = ["xlib"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# objc `msg_send!` / `class!` 宏会展开 `cfg(feature = "cargo-clippy")`；
# 必须在消费 crate 声明，否则 macOS 上 `clippy -D warnings` 会失败。
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
