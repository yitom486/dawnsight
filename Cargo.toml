[workspace]
members = [
    "apps/desktop/src-tauri",
    "crates/dawnsight-core",
    "crates/dawnsight-acp",
    "crates/dawnsight-ai",
    "crates/dawnsight-library",
    "crates/dawnsight-notes",
    "crates/dawnsight-player",
    "crates/dawnsight-ytdl",
    "crates/dawnsight-mcp",
    "crates/dawnsight-media",
    "crates/dawnsight-subtitle",
    "crates/dawnsight-asr",
]
resolver = "2"

[workspace.dependencies]
dawnsight-core = { path = "crates/dawnsight-core" }
dawnsight-acp = { path = "crates/dawnsight-acp" }
dawnsight-ai = { path = "crates/dawnsight-ai" }
dawnsight-library = { path = "crates/dawnsight-library" }
dawnsight-notes = { path = "crates/dawnsight-notes" }
dawnsight-player = { path = "crates/dawnsight-player" }
dawnsight-ytdl = { path = "crates/dawnsight-ytdl" }
dawnsight-mcp = { path = "crates/dawnsight-mcp" }
dawnsight-media = { path = "crates/dawnsight-media" }
dawnsight-subtitle = { path = "crates/dawnsight-subtitle" }
dawnsight-asr = { path = "crates/dawnsight-asr" }
rusqlite = { version = "0.32", features = ["bundled"] }
