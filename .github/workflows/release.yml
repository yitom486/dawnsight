name: Private release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to build (e.g. v0.2.0)"
        required: true
        default: v0.4.1
      skip_linux:
        # Escape hatch for a release whose Linux bundle is known broken (v0.4.2:
        # linuxdeploy breaks the bun-compiled acp-engine sidecar). Only manual
        # runs can set it; tag pushes always require all three platforms.
        description: "Publish without Linux (Windows + macOS only)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  e2e:
    name: Full E2E (deterministic + online playback)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Setup native tools
        uses: ./.github/actions/setup-native-tools
        with:
          platform: windows

      - name: Install yt-dlp (latest stable)
        shell: pwsh
        run: |
          $dir = 'apps/desktop/src-tauri/native/ytdl'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          if (-not (Test-Path "$dir/yt-dlp.exe")) {
            curl.exe -L --fail --retry 3 -o "$dir/yt-dlp.exe" https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe
          }
          & "$dir/yt-dlp.exe" --version

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # tauri.conf.json bundles bin/acp-engine as an externalBin; the app's
      # build script fails without it. Compiled from @yitom/acp-client.
      - name: Build ACP engine sidecar
        run: node scripts/build-acp-engine.mjs

      - name: Run deterministic E2E suite
        run: bun run test:e2e:deterministic

      - name: Run online playback E2E
        run: bun run test:e2e:online

  release:
    name: Release (${{ matrix.platform }})
    needs: e2e
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.skip_linux && '[{"platform":"windows","runs-on":"windows-latest"},{"platform":"macos","runs-on":"macos-latest"}]' || '[{"platform":"windows","runs-on":"windows-latest"},{"platform":"macos","runs-on":"macos-latest"},{"platform":"linux","runs-on":"ubuntu-latest"}]') }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable

      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.platform == 'windows'

      - name: Cache Cargo registry and build metadata
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.platform }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-${{ matrix.platform }}-cargo-

      - name: Setup native tools
        uses: ./.github/actions/setup-native-tools
        with:
          platform: ${{ matrix.platform }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # tauri.conf.json bundles bin/acp-engine as an externalBin; the app's
      # build script fails without it. Compiled from @yitom/acp-client.
      - name: Build ACP engine sidecar
        run: node scripts/build-acp-engine.mjs

      - name: Run release quality gates
        run: |
          bun run lint:all
          bun run test
          bun run build

      - name: Validate Rust
        working-directory: apps/desktop/src-tauri
        run: |
          cargo fmt --check
          cargo check --all-targets
          cargo test --lib
          cargo clippy --all-targets -- -D warnings

      - name: Build installers
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing (0.3): create these repo secrets BEFORE tagging —
          # TAURI_SIGNING_PRIVATE_KEY (content of lumina-updater.key, keep secret!)
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD (empty for the 0.3 internal key).
          # Without them this step fails at signing with a clear error.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # AppImage: linuxdeploy strips every ELF it bundles, which breaks the
          # bun --compile acp-engine sidecar (its payload is appended to the
          # binary). Only linuxdeploy reads this variable.
          NO_STRIP: ${{ matrix.platform == 'linux' && 'true' || '' }}
        with:
          tauriScript: bun run tauri
          # createUpdaterArtifacts only here (never in CI debug builds):
          # emits .sig + latest.json next to the installers for the updater endpoints.
          # Linux builds run verbose so a linuxdeploy failure shows its cause.
          args: ${{ matrix.platform == 'linux' && '--verbose ' || '' }}--config {"bundle":{"createUpdaterArtifacts":true}}
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseName: Dawnsight ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseBody: "internal"
          releaseDraft: true
          prerelease: false

      - name: Upload built installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumina-${{ matrix.platform }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.tar.gz
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/nsis/*.sig
            target/release/bundle/macos/*.sig
            target/release/bundle/appimage/*.sig
          if-no-files-found: error
          retention-days: 7

  # Installers, signatures and latest.json all live in this repository's own
  # Releases (the tauri-action draft above). The old public `lumina-app` repo
  # only receives a latest.json bridge so pre-0.4.2 clients, whose updater
  # endpoint still points there, can find new versions.
  publish:
    name: Stage all three platforms in release draft
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SKIP_LINUX: ${{ inputs.skip_linux && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          pattern: lumina-*
          path: public-assets

      - name: Verify complete three-platform asset set and stage draft
        shell: bash
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          REPO="${{ github.repository }}"
          VERSION="${TAG#v}"
          BODY="Dawnsight ${TAG} 发布。"
          CHANGELOG_BODY="$(awk -v version="$VERSION" '$0 ~ "^## " version "[[:space:]]" {found=1; next} found && /^## / {exit} found {print}' CHANGELOG.md)"
          if [ -n "$CHANGELOG_BODY" ]; then
            BODY="$CHANGELOG_BODY"
          fi
          PLATFORMS="windows macos linux"
          if [ "$SKIP_LINUX" = "true" ]; then
            PLATFORMS="windows macos"
            BODY="${BODY}

          > 本版本暂不提供 Linux 安装包（AppImage 打包问题修复中），Linux 用户请继续使用上一版本。"
          fi

          for platform in $PLATFORMS; do
            if [ ! -d "public-assets/lumina-${platform}" ]; then
              echo "::error::Missing ${platform} build artifact"
              exit 1
            fi
          done

          require_asset() {
            local directory="$1"
            local pattern="$2"
            if ! find "$directory" -type f -name "$pattern" -print -quit | grep -q .; then
              echo "::error::Missing required ${directory} asset matching ${pattern}"
              exit 1
            fi
          }
          require_asset public-assets/lumina-windows '*.exe'
          require_asset public-assets/lumina-windows '*.msi'
          require_asset public-assets/lumina-windows '*-setup.exe.sig'
          require_asset public-assets/lumina-macos '*.dmg'
          require_asset public-assets/lumina-macos '*.app.tar.gz'
          require_asset public-assets/lumina-macos '*.app.tar.gz.sig'
          if [ "$SKIP_LINUX" != "true" ]; then
            require_asset public-assets/lumina-linux '*.AppImage'
            require_asset public-assets/lumina-linux '*.deb'
            require_asset public-assets/lumina-linux '*.AppImage.sig'
          fi

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq '.isDraft')" != "true" ]; then
              echo "::error::Public release ${TAG} already exists and is published; refusing to append a partial rerun"
              exit 1
            fi
            # tauri-action created this draft with a placeholder body.
            gh release edit "$TAG" --repo "$REPO" --title "Dawnsight ${TAG}" --notes "$BODY"
          else
            gh release create "$TAG" --repo "$REPO" \
              --title "Dawnsight ${TAG}" \
              --notes "$BODY" \
              --draft
          fi

          mapfile -t FILES < <(find public-assets -type f -print | sort)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::No release assets were downloaded"
            exit 1
          fi
          gh release upload "$TAG" "${FILES[@]}" --repo "$REPO" --clobber

  updater:
    name: Merge updater metadata
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      SKIP_LINUX: ${{ inputs.skip_linux && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Build and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          REPO="${{ github.repository }}"
          VERSION="${TAG#v}"
          WORK="$(mktemp -d)"
          cd "$WORK"

          gh release download "$TAG" --repo "$REPO" --pattern "*.sig"

          BODY="Dawnsight ${TAG} 发布。

          **安装包**
          - Windows x64：MSI / NSIS
          - macOS aarch64：DMG
          - Linux x64：AppImage / deb

          **冒烟**：安装后打开本地视频；Linux 需 X11 会话（Wayland 暂不支持原生视频面）。"
          CHANGELOG_BODY=$(awk "/^## ${VERSION}[[:space:]]/{found=1; next} found && /^## /{exit} found{print}" "$GITHUB_WORKSPACE/CHANGELOG.md")
          if [ -n "$CHANGELOG_BODY" ]; then
            BODY="${CHANGELOG_BODY}"
          fi

          PLATFORMS="$(mktemp)"
          echo '{}' > "$PLATFORMS"
          for sig in *.sig; do
            case "$sig" in
              *-setup.exe.sig) platform="windows-x86_64" ;;
              *.app.tar.gz.sig) platform="darwin-aarch64" ;;
              *.AppImage.sig) platform="linux-x86_64" ;;
              *) echo "skip unexpected signature file: $sig"; continue ;;
            esac
            bundle="${sig%.sig}"
            staged="$(mktemp)"
            jq --arg p "$platform" \
               --rawfile signature "$sig" \
               --arg url "https://github.com/${REPO}/releases/download/${TAG}/${bundle}" \
               '.[$p] = {signature: $signature, url: $url}' "$PLATFORMS" > "$staged"
            mv "$staged" "$PLATFORMS"
            echo "mapped $platform -> $bundle"
          done

          if [ "$(jq 'keys | length' "$PLATFORMS")" -eq 0 ]; then
            echo "::error::no updater signatures found for ${TAG}"
            exit 1
          fi
          REQUIRED="windows-x86_64 darwin-aarch64 linux-x86_64"
          if [ "$SKIP_LINUX" = "true" ]; then
            REQUIRED="windows-x86_64 darwin-aarch64"
          fi
          for platform in $REQUIRED; do
            if ! jq -e --arg p "$platform" '.[$p] | (.signature | length > 0) and (.url | length > 0)' "$PLATFORMS" >/dev/null; then
              echo "::error::missing updater metadata for ${platform}"
              exit 1
            fi
          done

          jq -n --arg version "$VERSION" --arg notes "$BODY" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile wrapped "$PLATFORMS" \
            '$wrapped[0] as $platforms | {version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms}' \
            > latest.json
          gh release upload "$TAG" latest.json --repo "$REPO" --clobber
          cp latest.json "$RUNNER_TEMP/latest.json"

      - name: Stage legacy updater bridge in lumina-app
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          LEGACY_REPO: yitom486/lumina-app
        shell: bash
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::RELEASE_REPO_TOKEN is required to keep pre-0.4.2 clients updating"
            exit 1
          fi
          # Same latest.json: its URLs already point at this repository's assets.
          if ! gh release view "$TAG" --repo "$LEGACY_REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$LEGACY_REPO" \
              --title "Dawnsight ${TAG}" \
              --notes "Dawnsight 已迁移到 https://github.com/${{ github.repository }}/releases ，此处仅保留旧版本自动更新所需的 latest.json。" \
              --draft
          fi
          gh release upload "$TAG" "$RUNNER_TEMP/latest.json" --repo "$LEGACY_REPO" --clobber

  publish-release:
    name: Publish completed release
    needs: updater
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Publish verified three-platform release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          gh release edit "$RELEASE_TAG" --repo "$REPO" --draft=false --latest
          if [ "$(gh release view "$RELEASE_TAG" --repo "$REPO" --json isDraft --jq '.isDraft')" != "false" ]; then
            echo "::error::Release ${RELEASE_TAG} is still a draft"
            exit 1
          fi

      - name: Publish legacy updater bridge
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" --repo yitom486/lumina-app --draft=false --latest
