[package]
name = "dawnsight-notes"
version = "0.4.0"
description = "Timestamped notes, subtitle quotes, and Markdown export for Dawnsight"
edition = "2021"

[dependencies]
dawnsight-media.workspace = true
dawnsight-subtitle.workspace = true
dawnsight-ytdl.workspace = true
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
