[package]
name = "dawnsight-ytdl"
version = "0.4.0"
description = "Optional on-demand yt-dlp integration for Dawnsight"
edition = "2021"

[dependencies]
dawnsight-core.workspace = true
dawnsight-media.workspace = true
dawnsight-subtitle.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tracing = "0.1"
ureq = { version = "3.1", features = ["json"] }
which = "7"
