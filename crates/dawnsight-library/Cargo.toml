[package]
name = "dawnsight-library"
version = "0.4.0"
description = "Local media library and metadata resolution for Dawnsight"
edition = "2021"

[dependencies]
dawnsight-core.workspace = true
dawnsight-media.workspace = true
rusqlite.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
ureq = { version = "3.1", features = ["json"] }
url = "2"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }
