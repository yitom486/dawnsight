[package]
name = "dawnsight-mcp"
version = "0.4.0"
description = "Dawnsight MCP server, snapshots, tools, and policies"
edition = "2021"

[features]
test-support = []

[[bin]]
name = "dawnsight-mcp-stdio-test-server"
path = "tests/bin/dawnsight_mcp_stdio_test_server.rs"
required-features = ["test-support"]

[dependencies]
dawnsight-core.workspace = true
dawnsight-library.workspace = true
dawnsight-media.workspace = true
dawnsight-notes.workspace = true
dawnsight-subtitle.workspace = true
dawnsight-ytdl.workspace = true
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
